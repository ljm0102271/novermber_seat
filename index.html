<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 자리 뽑기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f0f2f5; margin-top: 50px; }
        .card-container { position: relative; width: 300px; height: 200px; margin: 20px auto; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: #007bff; }
        canvas { position: absolute; top: 0; left: 0; cursor: pointer; touch-action: none; }
        .info { margin-bottom: 20px; color: #666; font-size: 1.1rem; }
    </style>
    
    <!-- 최신 파이어베이스 SDK (Modular 방식) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 본인의 파이어베이스 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyAWqx6z0NWrmBBZ7F1patX7BfejmNV4RGQ",
            authDomain: "novemberseat.firebaseapp.com",
            projectId: "novemberseat",
            storageBucket: "novemberseat.firebasestorage.app",
            messagingSenderId: "808743313177",
            appId: "1:808743313177:web:1cc447ae25a0acd126f88",
            measurementId: "G-6ZEZND2HB9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const seatNumberSpan = document.getElementById('seat-number');
        const canvas = document.getElementById('scratchPad');
        const ctx = canvas.getContext('2d');

        // 스크래치 커버 그리기 (은색)
        ctx.fillStyle = '#c0c0c0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#555';
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('여기를 긁어서 번호 확인!', canvas.width / 2, canvas.height / 2 + 6);
        ctx.globalCompositeOperation = 'destination-out';

        async function getMySeat() {
            let mySeat = localStorage.getItem('my_seat_number');
            if (mySeat) {
                seatNumberSpan.innerText = `${mySeat}번`;
                return;
            }

            try {
                await runTransaction(db, async (transaction) => {
                    const docRef = doc(db, 'seats', 'status');
                    const docSnap = await transaction.get(docRef);
                    
                    if (!docSnap.exists()) {
                        throw "Firestore에 'seats/status' 문서가 존재하지 않습니다!";
                    }

                    let available = docSnap.data().available; // 남은 번호 배열
                    if (available.length === 0) throw "모든 번호가 배정되었습니다!";

                    const randomIndex = Math.floor(Math.random() * available.length);
                    mySeat = available.splice(randomIndex, 1)[0];

                    transaction.update(docRef, { available: available });
                });

                localStorage.setItem('my_seat_number', mySeat);
                seatNumberSpan.innerText = `${mySeat}번`;
            } catch (error) {
                alert("번호 배정 중 오류가 발생했습니다: " + error);
            }
        }

        getMySeat();

        // 스크래치 인터랙션 구현
        let isDrawing = false;
        function scratch(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', () => isDrawing = true);
        canvas.addEventListener('touchmove', scratch);
        window.addEventListener('touchend', () => isDrawing = false);
    </script>
</head>
<body>

    <h2>🎲 11월 자리 뽑기</h2>
    <p class="info">화면을 손가락으로 긁어서 내 번호를 확인하세요!</p>

    <div class="card-container">
        <span id="seat-number">--번</span>
        <canvas id="scratchPad" width="300" height="200"></canvas>
    </div>

</body>
</html>
