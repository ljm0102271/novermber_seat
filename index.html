<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎲 11월 자리 뽑기</title>
    <style>
        /* 페이퍼로지 (Paperlogy) 웹폰트 정의 */
        @font-face {
            font-family: 'Paperlogy-5Medium';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-1@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-family: 'Paperlogy-5Medium', sans-serif; /* 페이퍼로지 폰트 적용 */
            font-size: 2.2rem;
            color: #2c3e50;
            margin: 0 0 8px 0;
            letter-spacing: -1px;
        }
        .header p {
            font-size: 1rem;
            color: #606f7b;
            margin: 0;
        }

        /* 카드 상자 */
        .card-container {
            position: relative;
            width: 340px;
            height: 200px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.15), 0 5px 15px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .seat-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .seat-label {
            font-size: 0.9rem;
            color: #8898aa;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .seat-number {
            font-size: 3.2rem;
            font-weight: 800;
            color: #4f46e5;
            letter-spacing: -2px;
            text-shadow: 0 2px 10px rgba(79, 70, 229, 0.2);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        /* 교실 자리 배치도 영역 */
        .classroom-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-title {
            width: 60%;
            text-align: center;
            background: #e2e8f0;
            color: #475569;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            letter-spacing: 2px;
        }

        /* 3개 분단 배치 */
        .seating-chart {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        /* 분단 개별 스타일 (2열 5행) */
        .block {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr);
            border: 2px solid #333;
            background: #333;
            gap: 2px;
            flex: 1;
            max-width: 170px;
        }

        .seat-cell {
            background: #ffffff;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #333333;
            transition: all 0.3s ease;
        }

        /* 내 자리 하이라이트 애니메이션 */
        .seat-cell.my-seat {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
            font-size: 1.4rem;
            font-weight: 800;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: inset 0 0 0 2px #ffffff; }
            100% { transform: scale(0.95); box-shadow: inset 0 0 0 4px #a5b4fc; }
        }

        @media (max-width: 500px) {
            .seating-chart { gap: 8px; }
            .seat-cell { height: 42px; font-size: 0.95rem; }
        }
    </style>

    <!-- 최신 파이어베이스 SDK (Modular 방식) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWqx6z0NWrmBBZ7F1patX7BfejmNV4RGQ",
            authDomain: "novemberseat.firebaseapp.com",
            projectId: "novemberseat",
            storageBucket: "novemberseat.firebasestorage.app",
            messagingSenderId: "808743313177",
            appId: "1:808743313177:web:1cc447ae25a0acd126f88",
            measurementId: "G-6ZEZND2HB9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const seatNumberSpan = document.getElementById('seat-number');
        const canvas = document.getElementById('scratchPad');
        const ctx = canvas.getContext('2d');

        let assignedSeat = null;
        let isRevealed = false;

        // 스크래치 커버 그리기
        function drawScratchCover() {
            const width = canvas.width;
            const height = canvas.height;

            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#e0e0e0');
            gradient.addColorStop(0.5, '#b8b8b8');
            gradient.addColorStop(1, '#9e9e9e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)';
                ctx.fillRect(Math.random() * width, Math.random() * height, 2, 2);
            }

            ctx.fillStyle = '#424242';
            ctx.font = 'bold 18px Pretendard, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✨ 손으로 긁어보세요 ✨', width / 2, height / 2);
        }

        drawScratchCover();

        // 칠판 밑 1~30번 자리 배치도 동적 생성
        function createSeatingChart() {
            const block1 = document.getElementById('block1');
            const block2 = document.getElementById('block2');
            const block3 = document.getElementById('block3');

            for (let i = 1; i <= 30; i++) {
                const cell = document.createElement('div');
                cell.className = 'seat-cell';
                cell.id = `seat-cell-${i}`;
                cell.innerText = i;

                if (i <= 10) {
                    block1.appendChild(cell);
                } else if (i <= 20) {
                    block2.appendChild(cell);
                } else {
                    block3.appendChild(cell);
                }
            }
        }

        createSeatingChart();

        // 지운 영역 비율을 계산하여 배치도 표에 표시 (40% 지웠을 때만)
        function checkScratchProgress() {
            if (isRevealed || !assignedSeat) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const totalPixels = canvas.width * canvas.height;
            const scratchedRatio = transparentPixels / totalPixels;

            if (scratchedRatio > 0.4) {
                isRevealed = true;
                const targetCell = document.getElementById(`seat-cell-${assignedSeat}`);
                if (targetCell) {
                    targetCell.classList.add('my-seat');
                }
            }
        }

        async function getMySeat() {
            let mySeat = localStorage.getItem('my_seat_number');
            if (mySeat) {
                assignedSeat = mySeat;
                seatNumberSpan.innerText = `${mySeat}번`;
                return;
            }

            try {
                await runTransaction(db, async (transaction) => {
                    const docRef = doc(db, 'seats', 'status');
                    const docSnap = await transaction.get(docRef);

                    if (!docSnap.exists()) {
                        throw "Firestore에 'seats/status' 문서가 존재하지 않습니다!";
                    }

                    let available = docSnap.data().available;
                    if (available.length === 0) throw "모든 번호가 배정되었습니다!";

                    const randomIndex = Math.floor(Math.random() * available.length);
                    mySeat = available.splice(randomIndex, 1)[0];

                    transaction.update(docRef, { available: available });
                });

                localStorage.setItem('my_seat_number', mySeat);
                assignedSeat = mySeat;
                seatNumberSpan.innerText = `${mySeat}번`;
            } catch (error) {
                alert("번호 배정 중 오류가 발생했습니다: " + error);
            }
        }

        getMySeat();

        // 부드러운 스크래치 인터랙션
        let isDrawing = false;
        let lastPos = { x: 0, y: 0 };

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startScratch(e) {
            isDrawing = true;
            lastPos = getPos(e);
            scratch(e);
        }

        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const currentPos = getPos(e);

            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 45;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(lastPos.x, lastPos.y);
            ctx.lineTo(currentPos.x, currentPos.y);
            ctx.stroke();

            lastPos = currentPos;
            checkScratchProgress();
        }

        function stopScratch() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startScratch);
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', stopScratch);

        canvas.addEventListener('touchstart', startScratch, { passive: false });
        canvas.addEventListener('touchmove', scratch, { passive: false });
        window.addEventListener('touchend', stopScratch);
    </script>
</head>
<body>

    <div class="header">
        <h1>🎲 11월 자리 뽑기</h1>
        <p>카드를 긁어 번호를 확인하고, 내 자리를 확인하세요!</p>
    </div>

    <!-- 스크래치 카드 -->
    <div class="card-container">
        <div class="seat-content">
            <div class="seat-label">MY SEAT</div>
            <div class="seat-number" id="seat-number">--번</div>
        </div>
        <canvas id="scratchPad" width="340" height="200"></canvas>
    </div>

    <!-- 교실 자리 배치도 -->
    <div class="classroom-container">
        <div class="board-title">칠 판 (교탁)</div>
        <div class="seating-chart">
            <div class="block" id="block1"></div>
            <div class="block" id="block2"></div>
            <div class="block" id="block3"></div>
        </div>
    </div>

</body>
</html>
