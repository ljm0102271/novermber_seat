<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎲 11월 자리 뽑기</title>
    <style>
        @font-face {
            font-family: 'Paperlogy-5Medium';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-1@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            width: 100%;
            max-width: 650px;
        }
        .header h1 {
            font-family: 'Paperlogy-5Medium', sans-serif;
            font-size: 2.2rem;
            color: #1565c0;
            margin: 0 0 8px 0;
            letter-spacing: -1px;
        }
        .header p {
            font-size: 1rem;
            color: #37474f;
            margin: 0 0 10px 0;
        }

        /* 결과 확인 탭 버튼 */
        .toggle-btn {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.3);
            transition: all 0.2s ease;
        }
        .toggle-btn:hover { background-color: #1565c0; transform: translateY(-1px); }

        /* 카드 상자 */
        .card-container {
            position: relative;
            width: 340px;
            height: 200px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(21, 101, 192, 0.1), 0 5px 15px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            border: 2px solid #bbdefb;
        }

        .seat-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .seat-label {
            font-size: 0.9rem;
            color: #90a4ae;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .seat-number {
            font-size: 3.2rem;
            font-weight: 800;
            color: #1976d2;
            letter-spacing: -2px;
            text-shadow: 0 2px 10px rgba(25, 118, 210, 0.2);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        /* 교실 자리 배치도 영역 */
        .classroom-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(21, 101, 192, 0.08);
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #bbdefb;
        }

        .board-title {
            width: 60%;
            text-align: center;
            background: #e3f2fd;
            color: #1565c0;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            letter-spacing: 2px;
        }

        .seating-chart {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .block {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr);
            border: 2px solid #90caf9;
            background: #90caf9;
            gap: 2px;
            flex: 1;
            max-width: 180px;
        }

        .seat-cell {
            background: #ffffff;
            height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 600;
            color: #37474f;
            transition: all 0.3s ease;
            padding: 2px;
        }

        .seat-cell .student-name {
            font-size: 0.75rem;
            color: #1976d2;
            font-weight: 700;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .seat-cell.my-seat {
            background-color: #1976d2 !important;
            color: #ffffff !important;
            animation: pulse 1.5s infinite alternate;
        }
        .seat-cell.my-seat .student-name {
            color: #ffffff !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: inset 0 0 0 2px #ffffff; }
            100% { transform: scale(0.95); box-shadow: inset 0 0 0 4px #90caf9; }
        }

        /* 이름 입력 팝업 모달 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(21, 101, 192, 0.15);
            border: 2px solid #bbdefb;
        }
        .modal-box h3 { margin: 0 0 10px 0; color: #1565c0; font-size: 1.3rem; }
        .modal-box p { margin: 0 0 20px 0; color: #546e7a; font-size: 0.9rem; }
        .modal-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #90caf9;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }
        .modal-box input:focus { border-color: #1976d2; }
        .modal-box button {
            width: 100%;
            padding: 12px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-box button:hover { background: #1565c0; }

        @media (max-width: 500px) {
            .seating-chart { gap: 6px; }
            .seat-cell { height: 48px; font-size: 0.9rem; }
            .seat-cell .student-name { font-size: 0.68rem; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, runTransaction, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWqx6z0NWrmBBZ7F1patX7BfejmNV4RGQ",
            authDomain: "novemberseat.firebaseapp.com",
            projectId: "novemberseat",
            storageBucket: "novemberseat.firebasestorage.app",
            messagingSenderId: "808743313177",
            appId: "1:808743313177:web:1cc447ae25a0acd126f88",
            measurementId: "G-6ZEZND2HB9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const seatNumberSpan = document.getElementById('seat-number');
        const canvas = document.getElementById('scratchPad');
        const ctx = canvas.getContext('2d');
        const nameModal = document.getElementById('nameModal');
        const nameInput = document.getElementById('studentNameInput');
        const confirmNameBtn = document.getElementById('confirmNameBtn');
        const toggleResultBtn = document.getElementById('toggleResultBtn');

        let assignedSeat = null;
        let studentName = "";
        let isRevealed = false;
        let showAllResultMode = false;

        function drawScratchCover() {
            const width = canvas.width;
            const height = canvas.height;

            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#e3f2fd');
            gradient.addColorStop(0.5, '#bbdefb');
            gradient.addColorStop(1, '#90caf9');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.3)' : 'rgba(21,101,192,0.08)';
                ctx.fillRect(Math.random() * width, Math.random() * height, 2, 2);
            }

            ctx.fillStyle = '#1565c0';
            ctx.font = 'bold 18px Pretendard, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✨ 손으로 긁어보세요 ✨', width / 2, height / 2);
        }

        drawScratchCover();

        function createSeatingChart() {
            const block1 = document.getElementById('block1');
            const block2 = document.getElementById('block2');
            const block3 = document.getElementById('block3');

            for (let i = 1; i <= 30; i++) {
                const cell = document.createElement('div');
                cell.className = 'seat-cell';
                cell.id = `seat-cell-${i}`;
                cell.innerHTML = `<span>${i}</span><div class="student-name" id="name-tag-${i}"></div>`;

                if (i <= 10) block1.appendChild(cell);
                else if (i <= 20) block2.appendChild(cell);
                else block3.appendChild(cell);
            }
        }

        createSeatingChart();

        // 40% 이상 긁었을 때 내 자리 표시 및 이름 표시
        function checkScratchProgress() {
            if (isRevealed || !assignedSeat) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const totalPixels = canvas.width * canvas.height;
            const scratchedRatio = transparentPixels / totalPixels;

            if (scratchedRatio > 0.4) {
                isRevealed = true;
                const targetCell = document.getElementById(`seat-cell-${assignedSeat}`);
                if (targetCell) {
                    targetCell.classList.add('my-seat');
                    const nameTag = document.getElementById(`name-tag-${assignedSeat}`);
                    if (nameTag) nameTag.innerText = studentName;
                }
            }
        }

        // DB 기반 안전한 번호 조회 및 배정 로직
        async function getMySeat(name) {
            try {
                let mySeat = null;

                await runTransaction(db, async (transaction) => {
                    const docRef = doc(db, 'seats', 'status');
                    const docSnap = await transaction.get(docRef);

                    if (!docSnap.exists()) {
                        throw "Firestore에 'seats/status' 문서가 존재하지 않습니다!";
                    }

                    let data = docSnap.data();
                    let available = data.available || [];
                    let assignedList = data.assigned || {};

                    // 1. 이미 이 이름으로 배정된 자리가 있는지 확인 (재접속 방어)
                    for (const [seatNum, registeredName] of Object.entries(assignedList)) {
                        if (registeredName === name) {
                            mySeat = seatNum;
                            return;
                        }
                    }

                    // 2. 등록된 적이 없다면 새로 번호 뽑기
                    if (available.length === 0) throw "모든 번호가 배정되었습니다!";

                    const randomIndex = Math.floor(Math.random() * available.length);
                    mySeat = available.splice(randomIndex, 1)[0];
                    assignedList[mySeat] = name;

                    transaction.update(docRef, { 
                        available: available,
                        assigned: assignedList
                    });
                });

                localStorage.setItem('my_seat_number', mySeat);
                localStorage.setItem('my_student_name', name);
                assignedSeat = mySeat;
                studentName = name;
                seatNumberSpan.innerText = `${mySeat}번`;
                nameModal.style.display = 'none';
            } catch (error) {
                alert("번호 배정 중 오류가 발생했습니다: " + error);
            }
        }

        const savedName = localStorage.getItem('my_student_name');
        if (savedName) {
            getMySeat(savedName);
        }

        confirmNameBtn.addEventListener('click', () => {
            const inputVal = nameInput.value.trim();
            if (!inputVal) {
                alert("이름(또는 학번과 이름)을 입력해 주세요!");
                return;
            }
            getMySeat(inputVal);
        });

        onSnapshot(doc(db, 'seats', 'status'), (snapshot) => {
            if (!snapshot.exists()) return;
            const assignedData = snapshot.data().assigned || {};

            if (showAllResultMode) {
                for (let i = 1; i <= 30; i++) {
                    const nameTag = document.getElementById(`name-tag-${i}`);
                    if (nameTag && assignedData[i]) {
                        nameTag.innerText = assignedData[i];
                    }
                }
            }
        });

        toggleResultBtn.addEventListener('click', () => {
            showAllResultMode = !showAllResultMode;
            if (showAllResultMode) {
                toggleResultBtn.innerText = "🔍 내 자리만 보기";
                toggleResultBtn.style.backgroundColor = "#0288d1";
            } else {
                toggleResultBtn.innerText = "📊 전체 결과 확인";
                toggleResultBtn.style.backgroundColor = "#1976d2";
            }
        });

        let isDrawing = false;
        let lastPos = { x: 0, y: 0 };

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startScratch(e) {
            isDrawing = true;
            lastPos = getPos(e);
            scratch(e);
        }

        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const currentPos = getPos(e);

            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 45;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(lastPos.x, lastPos.y);
            ctx.lineTo(currentPos.x, currentPos.y);
            ctx.stroke();

            lastPos = currentPos;
            checkScratchProgress();
        }

        function stopScratch() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startScratch);
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', stopScratch);

        canvas.addEventListener('touchstart', startScratch, { passive: false });
        canvas.addEventListener('touchmove', scratch, { passive: false });
        window.addEventListener('touchend', stopScratch);
    </script>
</head>
<body>

    <div class="modal-overlay" id="nameModal">
        <div class="modal-box">
            <h3>👋 반가워요!</h3>
            <p>자리 뽑기를 시작하기 전에<br>본인의 학번과 이름을 입력해 주세요.</p>
            <input type="text" id="studentNameInput" placeholder="예: 10101 홍길동" autofocus>
            <button id="confirmNameBtn">입력 완료</button>
        </div>
    </div>

    <div class="header">
        <h1>🎲 11월 자리 뽑기</h1>
        <p>카드를 긁어 번호를 확인하고, 내 자리를 확인하세요!</p>
        <button class="toggle-btn" id="toggleResultBtn">📊 전체 결과 확인</button>
    </div>

    <div class="card-container">
        <div class="seat-content">
            <div class="seat-label">MY SEAT</div>
            <div class="seat-number" id="seat-number">--번</div>
        </div>
        <canvas id="scratchPad" width="340" height="200"></canvas>
    </div>

    <div class="classroom-container">
        <div class="board-title">칠 판 (교탁)</div>
        <div class="seating-chart">
            <div class="block" id="block1"></div>
            <div class="block" id="block2"></div>
            <div class="block" id="block3"></div>
        </div>
    </div>

</body>
</html>
